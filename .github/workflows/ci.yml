name: CI

on:
  push:
    branches: ['main']
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm test
      - name: Install mcp-servers/ package dependencies
        run: |
          for dir in mcp-servers/*/; do
            npm install --prefix "$dir"
          done
      - run: npm run verify:mcp-servers
