name: Publish to npm

# Publishes @karthicknethaji-hcl/agent-test-kit to the public npm registry
# whenever a version tag is pushed. Needs an NPM_TOKEN secret (an npm
# "Automation" access token for the @karthicknethaji-hcl user/org) added
# under this repo's Settings -> Secrets and variables -> Actions -- that
# token has to be created by hand on npmjs.com; nothing here can create it.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
          scope: '@karthicknethaji-hcl'
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
